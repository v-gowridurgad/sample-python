name: testing pip-install on ub-26
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-26.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
           python-version: "3.x"
           pip-install: -r requirements.txt
      - name: Check system Python
        run: |
            /usr/bin/python3 --version
            /usr/bin/python3 -m pip --version || true
            /usr/bin/python3 -c "import sys, sysconfig; from pathlib import Path; p = Path(sysconfig.get_path('stdlib')) / 'EXTERNALLY-MANAGED'; print(f'sys.executable={sys.executable}'); print(f'stdlib={sysconfig.get_path(\"stdlib\")}'); print(f'marker_path={p}'); print(f'marker_exists={p.exists()}')"
