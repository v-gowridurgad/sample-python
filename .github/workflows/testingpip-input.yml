name: testing pip-install on ub-26
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
           python-version: "3.x"
           pip-install: -r requirements.txt
      - name: Debug Python / PEP 668
        run: |
           which python
           python --version
           python -m pip --version
           python -c "import sys, sysconfig; from pathlib import Path; p = Path(sysconfig.get_path('stdlib')) / 'EXTERNALLY-MANAGED'; print(f'sys.executable={sys.executable}'); print(f'stdlib={sysconfig.get_path(\"stdlib\")}'); print(f'marker_path={p}'); print(f'marker_exists={p.exists()}')"
