name: testing pip-install on ub-26
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-26.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
           python-version: "3.x"
           pip-install: -r requirements.txt
